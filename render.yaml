services:
  - type: web
    name: narrativesignal-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: starter
    # API quotas, background slots, and DuckDB connections are process-local.
    numInstances: 1
    autoDeployTrigger: "off"
    healthCheckPath: /health
    disk:
      name: narrativesignal-data
      mountPath: /app/data
      sizeGB: 10
    envVars:
      - key: PORT
        value: "10000"
      - key: DATA_PATH
        value: /app/data
      - key: STREAMGRAPH2_DUCKDB_PATH
        value: /app/data/streamgraph2.duckdb
      - key: WEB_CONCURRENCY
        value: "1"
      - key: FRONTEND_ORIGINS
        sync: false
      - key: DEBUG
        value: "false"
      - key: NARRATIVE_API_TOKEN
        generateValue: true
      - key: RATE_LIMIT_MAX
        value: "60"
      - key: WORK_LIMIT_MAX
        value: "10"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT
        value: NarrativeSignal/1.0
      - key: NEWSAPI_KEY
        sync: false
      - key: NEWSDATA_KEY
        sync: false
      - key: GNEWS_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: CURRENTS_API_KEY
        sync: false
      - key: PRIMARY_MODEL
        value: openai/gpt-oss-20b
      - key: FAST_MODEL
        value: openai/gpt-oss-20b
